name: Certified Verifier Tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
    paths:
      - "crates/toolchain/build/**"
      - "crates/cli/**"
      - "crates/certified-verifier/**"
      - "crates/continuations/**"
      - "crates/recursion/**"
      - "crates/sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/lean-toolchain/**"
      - ".github/actions/rust-cache-cuda/**"
      - ".github/actions/sccache/**"
      - ".github/workflows/certified-verifier.yml"
      - "ci/scripts/check_certified_verifier_c.sh"
      - "scripts/gpu_driver_setup.sh"

concurrency:
  group: ${{ github.workflow_ref }}-certified-verifier-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # TODO: Replace this commit with a ws-fv release tag once one is available.
  WS_FV_REV: b03daf500ac65d523047e97c6f57bb98a3b00d30

jobs:
  openvm-tests:
    name: OpenVM SDK and CLI
    runs-on:
      - runs-on=${{ github.run_id }}-certified-verifier-openvm/image=ubuntu24-gpu-x64/family=g7.4xlarge+g6.4xlarge+g5.4xlarge/volume=80gb/spot=price-capacity-optimized/extras=s3-cache

    steps:
      - uses: runs-on/action@v2
        with:
          sccache: s3
      - uses: actions/checkout@v5
      - id: lean-toolchain
        uses: ./.github/actions/lean-toolchain
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.GH_ACTIONS_DEPLOY_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        env:
          RUSTUP_PERMIT_COPY_RENAME: "1"
      - uses: ./.github/actions/sccache

      # TODO: remove once https://github.com/runs-on/runner-images-for-aws/issues/55 is fixed
      - name: Setup GPU driver
        run: bash ./scripts/gpu_driver_setup.sh

      - uses: ./.github/actions/rust-cache-cuda
      - uses: taiki-e/install-action@nextest

      - name: Verify GPU setup
        run: |
          nvidia-smi
          nvidia-smi -L
          nvcc --version
          echo "CUDA_ARCH=86,89,120" >> "$GITHUB_ENV"

      - name: Setup CUDA environment
        run: |
          CUDART_PATH=$(find /usr/local -name "libcudart.so" | head -1)
          if [ -n "$CUDART_PATH" ]; then
            CUDA_LIB_DIR=$(dirname "$CUDART_PATH")
            echo "CUDA libraries found at: $CUDA_LIB_DIR"
            echo "CUDA_LIB_DIR=$CUDA_LIB_DIR" >> "$GITHUB_ENV"
          else
            echo "CUDA libraries not found!"
            exit 1
          fi

      - name: Build cargo-openvm
        run: |
          cargo build --locked --profile fast -p cargo-openvm --features cuda,certified-verifier
          echo "${{ github.workspace }}/target/fast" >> "$GITHUB_PATH"

      - name: Install guest rust-src
        run: rustup component add rust-src --toolchain nightly-2026-01-18

      - name: Run certified verifier tests
        run: |
          cargo nextest run --cargo-profile=fast --test-threads=1 \
            -p openvm-certified-verifier --features openvm-sdk/cuda

      - name: Run SDK certified verifier tests
        working-directory: crates/sdk
        env:
          OPENVM_SKIP_DEBUG: "1"
        run: |
          cargo nextest run --cargo-profile=fast --test-threads=1 \
            --features cuda,root-prover,certified-verifier -- test_certified_verifier

      - name: Run CLI certified STARK e2e test
        working-directory: crates/cli
        env:
          SKIP_INSTALL: "1"
        run: |
          cargo nextest run --cargo-profile=fast --test-threads=1 \
            --features cuda,certified-verifier \
            -E 'test(test_cli_stark_e2e_certified)'

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  installed-cli-test:
    name: Installed CLI after build target removal
    runs-on:
      - runs-on=${{ github.run_id }}-certified-verifier-install/volume=80gb/family=c8i-flex.16xlarge+c8i.16xlarge+c8a.16xlarge+c7i.16xlarge+c7a.16xlarge/image=ubuntu24-full-x64/extras=s3-cache

    steps:
      - uses: runs-on/action@v2
        with:
          sccache: s3
      - uses: actions/checkout@v5
      - id: lean-toolchain
        uses: ./.github/actions/lean-toolchain
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.GH_ACTIONS_DEPLOY_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/sccache

      - name: Install guest rust-src
        run: rustup component add rust-src --toolchain nightly-2026-01-18

      - name: Install cargo-openvm
        run: |
          install_root="${RUNNER_TEMP:?}/cargo-openvm-install"
          install_target="${RUNNER_TEMP:?}/cargo-openvm-install-target"
          cargo install --locked --path crates/cli --features certified-verifier \
            --profile fast --root "$install_root" --target-dir "$install_target"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          echo "CERTIFIED_CLI_TARGET_DIR=$install_target" >> "$GITHUB_ENV"
          echo "CERTIFIED_CONFIG_PATH=${RUNNER_TEMP:?}/openvm-riscv32.toml" >> "$GITHUB_ENV"
          echo "CERTIFIED_PROOF_PATH=${RUNNER_TEMP:?}/fibonacci.stark.proof" >> "$GITHUB_ENV"

      - name: Prove Fibonacci
        working-directory: crates/cli
        run: |
          printf '[app_vm_config.rv32i]\n[app_vm_config.rv32m]\n[app_vm_config.io]\n' \
            > "$CERTIFIED_CONFIG_PATH"
          cargo openvm keygen \
            --manifest-path tests/programs/multi/Cargo.toml \
            --config "$CERTIFIED_CONFIG_PATH"
          cargo openvm setup
          cargo openvm prove stark \
            --manifest-path tests/programs/multi/Cargo.toml \
            --example fibonacci \
            --config "$CERTIFIED_CONFIG_PATH" \
            --proof "$CERTIFIED_PROOF_PATH"

      - name: Delete Cargo install target
        run: |
          rm -rf -- "${CERTIFIED_CLI_TARGET_DIR:?}"
          test ! -e "$CERTIFIED_CLI_TARGET_DIR"

      - name: Verify Fibonacci with the installed certified verifier
        working-directory: crates/cli
        run: |
          output=$(cargo openvm verify stark \
            --manifest-path tests/programs/multi/Cargo.toml \
            --example fibonacci \
            --proof "$CERTIFIED_PROOF_PATH" \
            --certified 2>&1 | tee /dev/stderr)
          grep -q "Certified verifier accepted the proof" <<<"$output"

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  ws-fv-tests:
    name: Generated C matches upstream
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - id: lean-toolchain
        uses: ./.github/actions/lean-toolchain
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.GH_ACTIONS_DEPLOY_PRIVATE_KEY }}

      - name: Check out pinned ws-fv
        id: checkout-ws-fv
        run: |
          git clone --filter=blob:none --no-checkout git@github.com:axiom-crypto/ws-fv.git ws-fv
          git -C ws-fv checkout --detach "$WS_FV_REV"
          echo "revision=$(git -C ws-fv rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache ws-fv Lean build
        uses: actions/cache@v4
        with:
          path: ws-fv/.lake
          key: ${{ runner.os }}-ws-fv-${{ steps.checkout-ws-fv.outputs.revision }}-${{ steps.lean-toolchain.outputs.toolchain }}

      - name: Build upstream Lean verifier executables
        working-directory: ws-fv
        run: |
          test "$(tr -d '\r\n' < lean-toolchain)" = "$LEAN_TOOLCHAIN"
          elan run "$LEAN_TOOLCHAIN" lake build vm_verify

      - name: Build upstream parser utility
        working-directory: ws-fv/.lake/packages/swirl-rbr-fv
        run: |
          elan run "$LEAN_TOOLCHAIN" lake build swirl_dump_proof

      - name: Check vendored C against Lean-generated C
        run: bash ci/scripts/check_certified_verifier_c.sh ws-fv
