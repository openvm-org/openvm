name: Certified Verifier Tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
    paths:
      - "crates/toolchain/build/**"
      - "crates/cli/**"
      - "crates/certified-verifier/**"
      - "crates/continuations/**"
      - "crates/recursion/**"
      - "crates/sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/lean-toolchain/**"
      - ".github/actions/sccache/**"
      - ".github/workflows/certified-verifier.yml"
      - "ci/scripts/check_swirl_verifier_c.sh"

concurrency:
  group: ${{ github.workflow_ref }}-certified-verifier-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  openvm-tests:
    name: OpenVM SDK and CLI
    runs-on:
      - runs-on=${{ github.run_id }}-certified-verifier-openvm/volume=80gb/family=c8i-flex.16xlarge+c8i.16xlarge+c8a.16xlarge+c7i.16xlarge+c7a.16xlarge/image=ubuntu24-full-x64/extras=s3-cache

    steps:
      - uses: runs-on/action@v2
        with:
          sccache: s3
      - uses: actions/checkout@v5
      - id: lean-toolchain
        uses: ./.github/actions/lean-toolchain
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.GH_ACTIONS_DEPLOY_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/sccache
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest

      - name: Build cargo-openvm
        run: |
          cargo build --locked --profile fast -p cargo-openvm --features certified-verifier
          echo "${{ github.workspace }}/target/fast" >> "$GITHUB_PATH"

      - name: Install guest rust-src
        run: rustup component add rust-src --toolchain nightly-2026-01-18

      - name: Run certified verifier tests
        run: |
          cargo nextest run --cargo-profile=fast --test-threads=1 \
            -p openvm-certified-verifier

      - name: Run SDK certified verifier tests
        working-directory: crates/sdk
        env:
          OPENVM_SKIP_DEBUG: "1"
        run: |
          cargo nextest run --cargo-profile=fast --test-threads=1 \
            --features root-prover,certified-verifier -- test_certified_verifier

      - name: Run CLI certified STARK e2e test
        working-directory: crates/cli
        env:
          SKIP_INSTALL: "1"
        run: |
          cargo nextest run --cargo-profile=fast --test-threads=1 --features certified-verifier \
            -E 'test(test_cli_stark_e2e_certified)'

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  installed-cli-test:
    name: Installed CLI after build target removal
    runs-on:
      - runs-on=${{ github.run_id }}-certified-verifier-install/volume=80gb/family=c8i-flex.16xlarge+c8i.16xlarge+c8a.16xlarge+c7i.16xlarge+c7a.16xlarge/image=ubuntu24-full-x64/extras=s3-cache

    steps:
      - uses: runs-on/action@v2
        with:
          sccache: s3
      - uses: actions/checkout@v5
      - id: lean-toolchain
        uses: ./.github/actions/lean-toolchain
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.GH_ACTIONS_DEPLOY_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/sccache

      - name: Install guest rust-src
        run: rustup component add rust-src --toolchain nightly-2026-01-18

      - name: Install cargo-openvm
        run: |
          install_root="${RUNNER_TEMP:?}/cargo-openvm-install"
          install_target="${RUNNER_TEMP:?}/cargo-openvm-install-target"
          cargo install --locked --path crates/cli --features certified-verifier \
            --profile fast --root "$install_root" --target-dir "$install_target"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          echo "CERTIFIED_CLI_TARGET_DIR=$install_target" >> "$GITHUB_ENV"
          echo "CERTIFIED_CONFIG_PATH=${RUNNER_TEMP:?}/openvm-riscv32.toml" >> "$GITHUB_ENV"
          echo "CERTIFIED_PROOF_PATH=${RUNNER_TEMP:?}/fibonacci.stark.proof" >> "$GITHUB_ENV"

      - name: Prove Fibonacci
        working-directory: crates/cli
        run: |
          printf '[app_vm_config.rv32i]\n[app_vm_config.rv32m]\n[app_vm_config.io]\n' \
            > "$CERTIFIED_CONFIG_PATH"
          cargo openvm keygen \
            --manifest-path tests/programs/multi/Cargo.toml \
            --config "$CERTIFIED_CONFIG_PATH"
          cargo openvm setup
          cargo openvm prove stark \
            --manifest-path tests/programs/multi/Cargo.toml \
            --example fibonacci \
            --config "$CERTIFIED_CONFIG_PATH" \
            --proof "$CERTIFIED_PROOF_PATH"

      - name: Delete Cargo install target
        run: |
          rm -rf -- "${CERTIFIED_CLI_TARGET_DIR:?}"
          test ! -e "$CERTIFIED_CLI_TARGET_DIR"

      - name: Verify Fibonacci with the installed certified verifier
        working-directory: crates/cli
        run: |
          output=$(cargo openvm verify stark \
            --manifest-path tests/programs/multi/Cargo.toml \
            --example fibonacci \
            --proof "$CERTIFIED_PROOF_PATH" \
            --certified 2>&1 | tee /dev/stderr)
          grep -q "Certified verifier accepted the proof" <<<"$output"

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  swirl-rbr-fv-tests:
    name: Generated C matches upstream
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - id: lean-toolchain
        uses: ./.github/actions/lean-toolchain
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.GH_ACTIONS_DEPLOY_PRIVATE_KEY }}

      - name: Check out current swirl-rbr-fv
        id: checkout-swirl
        run: |
          git clone --filter=blob:none git@github.com:axiom-crypto/swirl-rbr-fv.git swirl-rbr-fv
          echo "revision=$(git -C swirl-rbr-fv rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache swirl-rbr-fv Lean build
        uses: actions/cache@v4
        with:
          path: swirl-rbr-fv/.lake
          key: ${{ runner.os }}-swirl-rbr-fv-${{ steps.checkout-swirl.outputs.revision }}-${{ steps.lean-toolchain.outputs.toolchain }}

      - name: Build upstream Lean verifier executables
        working-directory: swirl-rbr-fv
        run: |
          test "$(tr -d '\r\n' < lean-toolchain)" = "$LEAN_TOOLCHAIN"
          elan run "$LEAN_TOOLCHAIN" lake build swirl_verify
          elan run "$LEAN_TOOLCHAIN" lake build swirl_dump_proof

      - name: Check vendored C against Lean-generated C
        run: bash ci/scripts/check_swirl_verifier_c.sh swirl-rbr-fv
