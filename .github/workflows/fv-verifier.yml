name: FV Verifier Tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
    paths:
      - "crates/toolchain/build/**"
      - "crates/cli/**"
      - "crates/fv-verifier/**"
      - "crates/sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/sccache/**"
      - ".github/workflows/fv-verifier.yml"
      - "ci/scripts/check_swirl_verifier_extraction.sh"
      - "ci/scripts/check_swirl_verifier_c.sh"

concurrency:
  group: ${{ github.workflow_ref }}-fv-verifier-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LEAN_TOOLCHAIN: leanprover/lean4:v4.26.0

jobs:
  openvm-tests:
    name: OpenVM SDK and CLI
    runs-on:
      - runs-on=${{ github.run_id }}-fv-verifier-openvm/volume=80gb/family=c8i-flex.16xlarge+c8i.16xlarge+c8a.16xlarge+c7i.16xlarge+c7a.16xlarge/image=ubuntu24-full-x64/extras=s3-cache

    steps:
      - uses: runs-on/action@v2
        with:
          sccache: s3
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.GH_ACTIONS_DEPLOY_PRIVATE_KEY }}
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/sccache
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest

      - name: Install Lean toolchain
        # openvm-fv-verifier's build.rs needs leanc from the toolchain that generated csrc/.
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$LEAN_TOOLCHAIN"

      - name: Build cargo-openvm
        run: |
          cargo build --locked --profile fast -p cargo-openvm --features fv-verifier
          echo "${{ github.workspace }}/target/fast" >> "$GITHUB_PATH"

      - name: Install guest rust-src
        run: rustup component add rust-src --toolchain nightly-2026-01-18

      - name: Run fv verifier tests
        run: |
          cargo nextest run --cargo-profile=fast --test-threads=1 \
            -p openvm-fv-verifier

      - name: Run SDK FV verifier tests
        working-directory: crates/sdk
        env:
          OPENVM_SKIP_DEBUG: "1"
        run: |
          cargo nextest run --cargo-profile=fast --test-threads=1 \
            --features root-prover,fv-verifier -- test_fv_verifier

      - name: Run CLI FV verifier stark e2e test
        working-directory: crates/cli
        env:
          SKIP_INSTALL: "1"
        run: |
          cargo nextest run --cargo-profile=fast --test-threads=1 --features fv-verifier \
            -E 'test(test_cli_stark_e2e_fv_verified)'

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  # TODO[INT-9153]: update used repos and references
  swirl-rbr-fv-tests:
    name: Locked Rust extraction and generated C consistency
    runs-on: ubuntu-latest

    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.GH_ACTIONS_DEPLOY_PRIVATE_KEY }}
      - uses: actions/checkout@v5

      - name: Check out current swirl-rbr-fv
        id: checkout-swirl
        run: |
          git clone --filter=blob:none git@github.com:axiom-crypto/swirl-rbr-fv.git swirl-rbr-fv
          echo "revision=$(git -C swirl-rbr-fv rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Route the private rust-to-lean clone through SSH
        run: |
          git config --global \
            url."git@github.com:axiom-crypto/rust-to-lean".insteadOf \
            "https://github.com/axiom-crypto/rust-to-lean"

      - name: Install Rust extraction toolchain
        run: |
          source swirl-rbr-fv/verifier-lean/extraction/sources.lock
          rustup toolchain install "$R2L_RUST_TOOLCHAIN" --profile minimal

      - name: Check Lean model against OpenVM's locked Rust verifier
        run: bash ci/scripts/check_swirl_verifier_extraction.sh swirl-rbr-fv

      - name: Install Lean toolchain
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$LEAN_TOOLCHAIN"

      - name: Cache swirl-rbr-fv Lean build
        uses: actions/cache@v4
        with:
          path: swirl-rbr-fv/.lake
          key: ${{ runner.os }}-swirl-rbr-fv-${{ steps.checkout-swirl.outputs.revision }}-${{ env.LEAN_TOOLCHAIN }}

      - name: Build upstream Lean verifier executables
        working-directory: swirl-rbr-fv
        run: |
          lake build swirl_verify
          lake build swirl_dump_proof

      - name: Check vendored C against Lean-generated C
        run: bash ci/scripts/check_swirl_verifier_c.sh swirl-rbr-fv
