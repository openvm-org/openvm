[workspace]
resolver = "2"

[package]
name = "openvm-caci-test-programs"
version = "0.0.0"
edition = "2021"

[dependencies]
openvm = { path = "../../../../crates/toolchain/openvm" }
openvm-caci = { path = "../../" }

serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }

[features]
default = []
std = ["serde/std", "openvm/std"]

[profile.release]
panic = "abort"
lto = "thin"    # turn on lto = fat to decrease binary size, but this optimizes out some missing extern links so we shouldn't use it for testing

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(openvm_intrinsics)', 'cfg(target_os, values("openvm"))'] }
