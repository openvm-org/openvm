[advisories]
  ignore = [
  # an older version of tracing-subscriber 0.2.25 is used in ark-bn254 but it is an optional dependency that is not included in the crate graph even with all features enabled
  # unfortunately cargo audit includes optional dependencies from Cargo.lock even if they are not in the crate graph
  "RUSTSEC-2025-0055",
  # quick-xml 0.39.4 is pulled in by inferno 0.12.6, which is only used by the optional cell-profiling feature.
  # TODO: remove these ignores once inferno is updated to a fixed quick-xml range.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # crypto-bigint 0.5.5 is pulled in by elliptic-curve 0.13 (k256/p256 0.13) and aws-sigv4; the fix is only in crypto-bigint >=0.7.6,
  # which requires an invasive update to the openvm k256/p256 patches. The patches do not support secret key signing in openvm guest programs and are not affected by the CVE.
  # TODO: remove this ignore once the elliptic-curve dependencies are upgraded.
  "RUSTSEC-2026-0387",
  ]
